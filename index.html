<!DOCTYPE html>
<html>
    <head>
        <title>Library Membership Form</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Library Membership Form</h1>
        <form id="memberForm">
            <label>Name: </label>
            <input type="text" id="name" required>
            <br><br>
            <label>Age:</label>
            <input type="number" id="age" required>
            <br><br>
            <label>Email:</label>
            <input type="email" id="email" required>
            <br><br>
            <label>Phone:</label>
            <input type="tel" id="phone" required>
            <br><br>
            <label>Membership: </label>
            <input type="radio" name="membership" value="Basic" checked> Basic
            <input type="radio" name="membership" value="Silver"> Silver
            <input type="radio" name="membership" value="Gold"> Gold
            <br><br>
            <input type="submit" value="Register">
        </form>

        <div id="output"></div>
        <script src="script.js"></script>
    </body>
</html>
